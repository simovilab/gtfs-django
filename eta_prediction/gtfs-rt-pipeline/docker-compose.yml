services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: gtfs
      POSTGRES_PASSWORD: gtfs
      POSTGRES_DB: gtfs
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtfs -d gtfs"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      # Context is the repo root so the gtfs-django package + feature_engineering
      # are available; Dockerfile path is relative to that context.
      context: ../..
      dockerfile: eta_prediction/gtfs-rt-pipeline/Dockerfile
    env_file: .env
    working_dir: /app/eta_prediction/gtfs-rt-pipeline
    volumes:
      - .:/app/eta_prediction/gtfs-rt-pipeline
      - ../feature_engineering:/app/eta_prediction/feature_engineering
      - ../datasets:/app/eta_prediction/datasets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "18000:8000"
    command: >
      bash -c "
        python manage.py migrate --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "
    restart: unless-stopped

  # Poll + hourly spool flush. MUST stay at --concurrency=1: DuckDB permits a
  # single read-write process per database file, and both tasks write the spool.
  celery-worker:
    build:
      context: ../..
      dockerfile: eta_prediction/gtfs-rt-pipeline/Dockerfile
    env_file: .env
    working_dir: /app/eta_prediction/gtfs-rt-pipeline
    volumes:
      - .:/app/eta_prediction/gtfs-rt-pipeline
      - ../feature_engineering:/app/eta_prediction/feature_engineering
      - ../datasets:/app/eta_prediction/datasets
      - vp_spool:/data/spool
      - /var/lib/simovi/status:/var/lib/simovi/status
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -c "
        celery -A ingestproj worker -Q fetch,upsert -l INFO --concurrency=1
      "
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Daily compaction only. Touches S3, never the spool, so it is safe on its
  # own process — and it runs for minutes, which must not stall polling.
  celery-maint:
    build:
      context: ../..
      dockerfile: eta_prediction/gtfs-rt-pipeline/Dockerfile
    env_file: .env
    working_dir: /app/eta_prediction/gtfs-rt-pipeline
    volumes:
      - .:/app/eta_prediction/gtfs-rt-pipeline
      - ../feature_engineering:/app/eta_prediction/feature_engineering
      - /var/lib/simovi/status:/var/lib/simovi/status
    depends_on:
      redis:
        condition: service_healthy
    command: >
      bash -c "
        celery -A ingestproj worker -Q maint -l INFO --concurrency=1
      "
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  celery-beat:
    build:
      context: ../..
      dockerfile: eta_prediction/gtfs-rt-pipeline/Dockerfile
    env_file: .env
    working_dir: /app/eta_prediction/gtfs-rt-pipeline
    volumes:
      - .:/app/eta_prediction/gtfs-rt-pipeline
      - ../feature_engineering:/app/eta_prediction/feature_engineering
    depends_on:
      celery-worker:
        condition: service_started
    command: >
      bash -c "
        celery -A ingestproj beat -l INFO
      "
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  postgres_data:
  # Durable spool. A container recreate must not lose the current hour of
  # fixes — that is the whole reason the spool is on disk rather than in memory.
  vp_spool:
